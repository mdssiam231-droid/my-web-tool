<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIAM DevConsole</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #080c16;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 20px;
        }

        /* ব্যাকগ্রাউন্ড ভিডিও */
        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: 0;
            transform: translate(-50%, -50%);
            object-fit: cover;
            filter: brightness(0.3) contrast(1.1);
        }

        /* গ্লাস কার্ড */
        .glass-card {
            position: relative;
            z-index: 10;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
        }

        .header {
            text-align: center;
            margin-bottom: 22px;
        }

        .icon-badge {
            width: 52px;
            height: 52px;
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #38bdf8;
            margin-bottom: 10px;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .header h1 {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .header p {
            color: #94a3b8;
            font-size: 13px;
            margin-top: 4px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            color: #64748b;
            font-size: 14px;
        }

        .input-wrapper input, .input-wrapper select {
            width: 100%;
            padding: 12px 14px 12px 40px;
            background: rgba(7, 10, 19, 0.7);
            border: 1px solid #1e293b;
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: 0.3s;
        }

        .input-wrapper input:focus, .input-wrapper select:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        button {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #0284c7, #6366f1);
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.3s;
            box-shadow: 0 8px 20px -4px rgba(2, 132, 199, 0.4);
            margin-top: 10px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* টার্মিনাল লগ */
        .terminal-screen {
            margin-top: 18px;
            background: #030712;
            border: 1px solid #1f2937;
            border-radius: 10px;
            padding: 12px;
            font-family: monospace;
            font-size: 12px;
            min-height: 80px;
            max-height: 120px;
            overflow-y: auto;
            color: #38bdf8;
        }

        .log-time { color: #64748b; }
        .log-success { color: #4ade80; }
        .log-error { color: #f87171; }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline id="bg-video">
        <source src="bg.mp4" type="video/mp4">
    </video>

    <div class="glass-card">
        <div class="header">
            <div class="icon-badge">
                <i class="fa-solid fa-code"></i>
            </div>
            <h1>SIAM DEV CONSOLE</h1>
            <p>API & Webhook Testing Interface</p>
        </div>

        <div class="input-group">
            <label><i class="fa-solid fa-link"></i> Endpoint URL</label>
            <div class="input-wrapper">
                <input type="text" id="endpoint" placeholder="https://jsonplaceholder.typicode.com/posts/1">
                <i class="fa-solid fa-globe"></i>
            </div>
        </div>

        <div class="input-group">
            <label><i class="fa-solid fa-sliders"></i> Request Method</label>
            <div class="input-wrapper">
                <select id="method">
                    <option value="GET">GET Request</option>
                    <option value="POST">POST Request</option>
                </select>
                <i class="fa-solid fa-network-wired"></i>
            </div>
        </div>

        <button onclick="handleRequest()" id="actionBtn">
            <span id="btnText">Send Request</span>
            <i class="fa-solid fa-bolt" id="btnIcon"></i>
        </button>

        <div class="terminal-screen" id="terminalLogs">
            <div><span class="log-time">[SYS]</span> Console ready.</div>
        </div>
    </div>

    <script>
        function appendLog(type, text) {
            const terminal = document.getElementById('terminalLogs');
            const timestamp = new Date().toTimeString().split(' ')[0];
            const div = document.createElement('div');
            div.innerHTML = `<span class="log-time">[${timestamp}]</span> <span class="log-${type}">${text}</span>`;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        async function handleRequest() {
            const endpoint = document.getElementById('endpoint').value.trim() || 'https://jsonplaceholder.typicode.com/posts/1';
            const method = document.getElementById('method').value;
            const actionBtn = document.getElementById('actionBtn');
            const btnText = document.getElementById('btnText');

            actionBtn.disabled = true;
            btnText.innerText = 'Connecting...';
            appendLog('info', `Sending ${method} to endpoint...`);

            try {
                const response = await fetch(endpoint, {
                    method: method
                });
                
                if (response.ok) {
                    appendLog('success', `Status: ${response.status} OK`);
                } else {
                    appendLog('error', `Status: ${response.status} Failed`);
                }
            } catch (err) {
                appendLog('error', 'Network error or CORS restriction');
            } finally {
                actionBtn.disabled = false;
                btnText.innerText = 'Send Request';
            }
        }
    </script>
</body>
</html>
