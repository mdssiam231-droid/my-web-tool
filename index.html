<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern API Sender</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            width: 90%;
            max-width: 380px;
        }

        .card h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
            color: #38bdf8;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #94a3b8;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: rgba(15, 23, 42, 0.6);
            color: #fff;
            outline: none;
            transition: 0.3s ease;
        }

        .input-group input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(135deg, #0284c7, #6366f1);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        #status {
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>API Sender</h2>

        <div class="input-group">
            <label for="phone">Phone Number</label>
            <input type="text" id="phone" placeholder="017xxxxxxxx">
        </div>

        <div class="input-group">
            <label for="amount">Amount</label>
            <input type="number" id="amount" placeholder="36">
        </div>

        <button onclick="sendData()" id="submitBtn">Submit</button>

        <p id="status"></p>
    </div>

    <script>
        async function sendData() {
            const phone = document.getElementById('phone').value.trim();
            const amount = document.getElementById('amount').value.trim();
            const status = document.getElementById('status');
            const btn = document.getElementById('submitBtn');

            if (!phone || !amount) {
                status.style.color = '#f87171';
                status.innerText = 'Please fill in all fields!';
                return;
            }

            status.style.color = '#38bdf8';
            status.innerText = 'Sending request...';
            btn.disabled = true;

            try {
                const response = await fetch('https://saifulbomb.vercel.app/bomb', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        number: phone,
                        amount: amount
                    })
                });

                if (response.ok) {
                    status.style.color = '#4ade80';
                    status.innerText = 'Request Successful!';
                } else {
                    status.style.color = '#f87171';
                    status.innerText = 'Server returned an error.';
                }
            } catch (err) {
                status.style.color = '#f87171';
                status.innerText = 'Failed! (CORS / Network Error)';
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
