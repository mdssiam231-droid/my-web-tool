<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Sender</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #080c16;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 20px;
        }

        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 1;
            opacity: 0.5;
        }

        .glow-1 {
            width: 300px;
            height: 300px;
            background: #2563eb;
            top: 10%;
            left: 15%;
        }

        .glow-2 {
            width: 300px;
            height: 300px;
            background: #7c3aed;
            bottom: 10%;
            right: 15%;
        }

        .glass-card {
            position: relative;
            z-index: 10;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 35px 30px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .icon-badge {
            width: 50px;
            height: 50px;
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #60a5fa;
            margin-bottom: 10px;
        }

        .header h1 {
            color: #f8fafc;
            font-size: 20px;
            font-weight: 700;
        }

        .header p {
            color: #94a3b8;
            font-size: 13px;
            margin-top: 4px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            color: #64748b;
            font-size: 14px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 14px 12px 40px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .input-wrapper input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        button {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.3s;
            box-shadow: 0 8px 20px -4px rgba(37, 99, 235, 0.4);
            margin-top: 10px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status-box {
            margin-top: 18px;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .status-loading {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #60a5fa;
            display: flex;
        }

        .status-success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #4ade80;
            display: flex;
        }

        .status-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            display: flex;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(96, 165, 250, 0.3);
            border-radius: 50%;
            border-top-color: #60a5fa;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <div class="glass-card">
        <div class="header">
            <div class="icon-badge">
                <i class="fa-solid fa-bolt"></i>
            </div>
            <h1>Automated Sender</h1>
            <p>Direct API Dispatch Console</p>
        </div>

        <div class="input-group">
            <label><i class="fa-solid fa-mobile-screen"></i> Phone Number</label>
            <div class="input-wrapper">
                <input type="tel" id="phone" placeholder="017xxxxxxxx">
                <i class="fa-solid fa-phone"></i>
            </div>
        </div>

        <div class="input-group">
            <label><i class="fa-solid fa-arrow-up-1-9"></i> Amount</label>
            <div class="input-wrapper">
                <input type="number" id="amount" placeholder="36" value="36">
                <i class="fa-solid fa-hashtag"></i>
            </div>
        </div>

        <button onclick="handleExecution()" id="actionBtn">
            <span id="btnText">Launch Request</span>
            <i class="fa-solid fa-paper-plane" id="btnIcon"></i>
        </button>

        <div id="statusAlert" class="status-box"></div>
    </div>

    <script>
        async function handleExecution() {
            const phone = document.getElementById('phone').value.trim();
            const amount = document.getElementById('amount').value.trim();
            const statusAlert = document.getElementById('statusAlert');
            const actionBtn = document.getElementById('actionBtn');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');

            if (!phone || !amount) {
                showStatus('error', '<i class="fa-solid fa-circle-exclamation"></i> সব ঘর পূরণ করুন!');
                return;
            }

            actionBtn.disabled = true;
            btnText.innerText = 'Processing...';
            btnIcon.className = 'fa-solid fa-spinner fa-spin';
            showStatus('loading', '<div class="spinner"></div> Sending request...');

            try {
                const response = await fetch('https://saifulbomb.vercel.app/bomb', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        number: phone,
                        amount: amount
                    })
                });

                if (response.ok) {
                    showStatus('success', '<i class="fa-solid fa-circle-check"></i> Request Successful!');
                } else {
                    showStatus('error', '<i class="fa-solid fa-triangle-exclamation"></i> Request failed.');
                }
            } catch (err) {
                showStatus('success', '<i class="fa-solid fa-circle-check"></i> Request Dispatched!');
            } finally {
                actionBtn.disabled = false;
                btnText.innerText = 'Launch Request';
                btnIcon.className = 'fa-solid fa-paper-plane';
            }
        }

        function showStatus(type, message) {
            const statusAlert = document.getElementById('statusAlert');
            statusAlert.className = `status-box status-${type}`;
            statusAlert.innerHTML = message;
        }
    </script>
</body>
</html>
